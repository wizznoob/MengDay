      // === Microphone / Blow Detection ===
      async function startMicDetection() {
       const dataArray = new Uint8Array(analyser.fftSize);

let blown = false;
let blowFrames = 0;

function detectBlow() {
    analyser.getByteTimeDomainData(dataArray);

    let sum = 0;

    for (let i = 0; i < dataArray.length; i++) {
        const deviation = dataArray[i] - 128;
        sum += deviation * deviation;
    }

    const rms = Math.sqrt(sum / dataArray.length);

    // Initial threshold; adjust after testing
    const BLOW_THRESHOLD = 12;

    if (rms > BLOW_THRESHOLD) {
        blowFrames++;
    } else {
        blowFrames = 0;
    }

    // Require several consecutive frames above threshold
    if (blowFrames >= 5 && !blown) {
        blown = true;
        blowOutCandles();
    }

    requestAnimationFrame(detectBlow);
}

detectBlow();
      }

      function blowOutCandles() {
    const cakeContainer = document.querySelector(".cake-container");
    const subTitle = document.getElementById("subTitle");

    // Prevent switching more than once
    if (cakeContainer.classList.contains("cake-2-active")) {
        return;
    }

    // Switch Cake 1 to Cake 2
    cakeContainer.classList.add("cake-2-active");

    // Disable the manual click after switching
    cakeContainer.onclick = null;

    // Update the birthday message
    subTitle.textContent =
        "YAYY TATAA ULANG TAHUNN!! Wishing you the happiest birthday ever!! 🎉";
}
